<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voice Recorder</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/lamejs/1.2.1/lame.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; }
  body {
    background: #000; color: #fff; min-height: 100vh;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column; align-items: center;
    padding: 12vh 20px 40px;
  }
  #time { font-size: 68px; font-weight: 300; font-variant-numeric: tabular-nums; }
  #status { color: #888; margin-top: 8px; font-size: 16px; min-height: 22px; }
  canvas { width: 100%; max-width: 560px; height: 120px; margin: 60px 0; }
  .controls { display: flex; gap: 36px; align-items: center; }
  button {
    border: 0; cursor: pointer; color: #fff; background: #1c1c1e;
    width: 64px; height: 64px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
  }
  button:focus-visible { outline: 2px solid #8ab4ff; outline-offset: 3px; }
  button:disabled { opacity: .35; cursor: default; }
  #main {
    width: 88px; height: 88px; padding: 0;
    background: conic-gradient(#ff9a6a, #d58aff, #5b8cff, #ff9a6a);
  }
  #main span {
    width: 80px; height: 80px; border-radius: 50%; background: #000;
    display: flex; align-items: center; justify-content: center;
  }
  #main i { width: 30px; height: 30px; border-radius: 50%; background: #e33; transition: .15s; }
  #main.rec i { border-radius: 8px; background: linear-gradient(135deg, #ff9a6a, #7d8bff); }
  #player { width: 100%; max-width: 560px; margin-top: 44px; display: none; }
  #player.show { display: block; }
  audio { width: 100%; }
  #dl {
    width: auto; height: auto; border-radius: 22px; padding: 12px 22px;
    margin-top: 16px; font-size: 15px; display: block; margin-inline: auto;
  }
</style>
</head>
<body>
  <div id="time">00:00.00</div>
  <div id="status">Tap the button to record</div>
  <canvas id="wave"></canvas>

  <div class="controls">
    <span style="width:64px"></span>
    <button id="main" aria-label="Record"><span><i></i></span></button>
    <button id="pause" aria-label="Pause" disabled>
      <svg width="22" height="22" viewBox="0 0 22 22" fill="#fff"><rect x="4" y="3" width="4" height="16" rx="1"/><rect x="14" y="3" width="4" height="16" rx="1"/></svg>
    </button>
  </div>

  <div id="player">
    <audio id="audio" controls></audio>
    <button id="dl">Download MP3</button>
  </div>

<script>
const $ = id => document.getElementById(id);
const main = $('main'), pauseBtn = $('pause'), timeEl = $('time'),
      statusEl = $('status'), audio = $('audio'), canvas = $('wave');
const ctx = canvas.getContext('2d');

let recorder, stream, chunks = [], analyser, audioCtx;
let startedAt = 0, elapsed = 0, timer, raf, blob;

function fmt(ms) {
  const s = ms / 1000, m = Math.floor(s / 60);
  return String(m).padStart(2, '0') + ':' + (s % 60).toFixed(2).padStart(5, '0');
}
function tick() { timeEl.textContent = fmt(elapsed + (Date.now() - startedAt)); }

function draw() {
  const dpr = devicePixelRatio || 1;
  canvas.width = canvas.clientWidth * dpr; canvas.height = canvas.clientHeight * dpr;
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  const data = new Uint8Array(analyser.fftSize);
  analyser.getByteTimeDomainData(data);
  const bars = 90, step = Math.floor(data.length / bars), w = canvas.width / bars;
  ctx.fillStyle = '#9a9ab8';
  for (let i = 0; i < bars; i++) {
    const v = Math.abs(data[i * step] - 128) / 128;
    const h = Math.max(3 * dpr, v * canvas.height * 1.6);
    ctx.fillRect(i * w + w * .25, (canvas.height - h) / 2, w * .5, h);
  }
  raf = requestAnimationFrame(draw);
}

async function start() {
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch (e) {
    statusEl.textContent = 'Microphone blocked. Allow access and try again.';
    return;
  }
  chunks = []; elapsed = 0; blob = null;
  $('player').classList.remove('show'); audio.removeAttribute('src');

  audioCtx = new AudioContext();
  analyser = audioCtx.createAnalyser(); analyser.fftSize = 2048;
  audioCtx.createMediaStreamSource(stream).connect(analyser);

  recorder = new MediaRecorder(stream);
  recorder.ondataavailable = e => e.data.size && chunks.push(e.data);
  recorder.onstop = finish;
  recorder.start();

  startedAt = Date.now(); timer = setInterval(tick, 30); draw();
  main.classList.add('rec'); pauseBtn.disabled = false;
  statusEl.textContent = 'High quality';
}

function stop() {
  if (recorder.state === 'paused') startedAt = Date.now();
  recorder.stop();
  stream.getTracks().forEach(t => t.stop());
  clearInterval(timer); cancelAnimationFrame(raf);
  if (recorder.state !== 'paused') elapsed += Date.now() - startedAt;
  timeEl.textContent = fmt(elapsed);
  main.classList.remove('rec'); pauseBtn.disabled = true;
  audioCtx.close();
}

function finish() {
  blob = new Blob(chunks, { type: recorder.mimeType });
  audio.src = URL.createObjectURL(blob);
  $('player').classList.add('show');
  statusEl.textContent = 'Saved. Press play to listen.';
}

function togglePause() {
  if (recorder.state === 'recording') {
    recorder.pause(); elapsed += Date.now() - startedAt;
    clearInterval(timer); cancelAnimationFrame(raf);
    statusEl.textContent = 'Paused';
  } else if (recorder.state === 'paused') {
    recorder.resume(); startedAt = Date.now();
    timer = setInterval(tick, 30); draw();
    statusEl.textContent = 'High quality';
  }
}

main.onclick = () => (recorder && recorder.state !== 'inactive') ? stop() : start();
pauseBtn.onclick = togglePause;

// Convert the recording to MP3 on download
$('dl').onclick = async () => {
  if (!blob) return;
  const btn = $('dl'); btn.disabled = true; btn.textContent = 'Converting…';
  try {
    const ac = new AudioContext();
    const buf = await ac.decodeAudioData(await blob.arrayBuffer());
    const pcm = buf.getChannelData(0);
    const samples = new Int16Array(pcm.length);
    for (let i = 0; i < pcm.length; i++) {
      const s = Math.max(-1, Math.min(1, pcm[i]));
      samples[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
    }
    const enc = new lamejs.Mp3Encoder(1, buf.sampleRate, 128);
    const out = [];
    for (let i = 0; i < samples.length; i += 1152) {
      const b = enc.encodeBuffer(samples.subarray(i, i + 1152));
      if (b.length) out.push(b);
    }
    const end = enc.flush(); if (end.length) out.push(end);
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob(out, { type: 'audio/mp3' }));
    a.download = 'recording-' + Date.now() + '.mp3';
    a.click(); ac.close();
  } catch (e) {
    statusEl.textContent = 'Could not convert to MP3.';
  }
  btn.disabled = false; btn.textContent = 'Download MP3';
};
</script>
</body>
</html>
